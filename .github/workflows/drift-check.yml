name: Drift Check

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        working-directory: terraform/environments/lab
        run: terraform init
      - name: Terraform Plan
        working-directory: terraform/environments/lab
        run: terraform plan -detailed-exitcode -no-color