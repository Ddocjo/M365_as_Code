name: Terraform Apply

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: lab
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        working-directory: terraform/environments/lab
        run: terraform init
      - name: Terraform Apply
        working-directory: terraform/environments/lab
        run: terraform apply -auto-approve